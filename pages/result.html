<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz avslutat | Quiz Tajm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fredoka:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/results.css" />
  </head>

  <body class="result-shell">
    <header class="result-header">
      <a
        class="result-logo"
        href="./index.html"
        aria-label="Quiz Tajm, till startsidan"
      >
        <img src="../img/logo.svg" alt="Quiz Tajm" />
      </a>
    </header>

    <main>
      <!-- Frame 3: Avslutat quiz -->
      <section
        class="finished-page"
        id="finished"
        aria-labelledby="finished-title"
      >
        <div class="confetti confetti-pink" aria-hidden="true"></div>
        <div class="confetti confetti-purple" aria-hidden="true"></div>
        <div class="confetti confetti-yellow" aria-hidden="true"></div>

        <div class="finished-card">
          <div class="finished-icon" aria-hidden="true">
            <svg
              viewBox="0 0 32 32"
              width="30"
              height="30"
              fill="none"
              stroke="currentColor"
              stroke-width="2.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M13.5 3.5c.8 6 3.8 9.1 9.2 10.1-5.4 1.2-8.5 4.2-9.2 10.3-.9-6.1-4-9.1-9.5-10.3 5.5-1 8.6-4.1 9.5-10.1Z"
              />
              <path d="M25.3 21v7m-3.5-3.5h7" />
            </svg>
          </div>

          <p class="result-eyebrow">Quizet är avslutat</p>
          <h1 id="finished-title">Bra jobbat!</h1>
          <p id="completed-date" hidden></p>

          <div class="score-display">
            <span class="score-number" id="final-score"></span>
            <span class="score-total">
              av <span id="final-total"></span> rätt
            </span>
          </div>

          <p class="finished-description">
            Klart på <span id="final-time"></span>. Se svaren och vad du kan ta
            med dig till nästa omgång.
          </p>

          <a class="result-primary-button" href="#results">
            <span>Se resultat</span>
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 12h15m-6-6 6 6-6 6" />
            </svg>
          </a>
        </div>
      </section>

      <!-- Frame 4: Ditt resultat -->
      <section
        class="results-page"
        id="results"
        aria-labelledby="results-title"
        hidden
      >
        <div class="results-intro">
          <p class="result-eyebrow">Quizet är klart</p>
          <h1 id="results-title">Ditt resultat</h1>
          <p class="results-description">
            <span id="result-score"></span> av
            <span id="result-total"></span> rätt på
            <span id="result-time"></span>.
          </p>
        </div>

        <section class="history-card" aria-labelledby="history-title">
          <div class="history-header">
            <h2 id="history-title">Dina senaste resultat</h2>
            <p>Dina fem senaste spelomgångar</p>
          </div>

          <ul class="history-list" id="history-list"></ul>
        </section>

        <section
          class="question-results"
          aria-label="Genomgång av quizfrågorna"
        ></section>

        <nav class="result-actions" aria-label="Efter quizet">
          <a class="result-primary-button" href="./questions.html"
            >Spela igen</a
          >
          <a class="result-secondary-button" href="./index.html">Byt tema</a>
        </nav>
      </section>
    </main>

    <script type="module">
      import { format } from "date-fns";
      import { sv } from "date-fns/locale";

      // Hämtar det sparade quizresultatet
      const result = JSON.parse(
        sessionStorage.getItem("quiztajm_current_result") ?? "null",
      );

      // Går tillbaka till startsidan om resultat saknas
      if (!result) {
        window.location.replace("./index.html");
      }

      // Hämtar HTML-elementet för datumet
      const dateElement = document.querySelector("#completed-date");

      // Visar spelarens riktiga poäng, totalantal och speltid
      if (result) {
        document.querySelector("#final-score").textContent = result.score;
        document.querySelector("#result-score").textContent = result.score;

        document.querySelector("#final-total").textContent = result.total;
        document.querySelector("#result-total").textContent = result.total;

        document.querySelector("#final-time").textContent = result.time;
        document.querySelector("#result-time").textContent = result.time;

        document
          .querySelector(".score-display")
          .setAttribute(
            "aria-label",
            `${result.score} av ${result.total} rätt`,
          );
      }

      // Formaterar och visar datumet om det finns
      if (result?.date) {
        dateElement.textContent = `Genomfört ${format(
          new Date(result.date),
          "EEEE d MMMM",
          { locale: sv },
        )}`;

        dateElement.hidden = false;
      }

      // Hämtar sparad resultathistorik
      const history = JSON.parse(
        localStorage.getItem("quiztajm_history") ?? "[]",
      );

      const historyList = document.querySelector("#history-list");

      // Visar varje tidigare spelomgång
      history.forEach((item) => {
        const li = document.createElement("li");
        li.className = "history-item";

        const date = document.createElement("time");
        date.dateTime = item.date;
        date.textContent = format(new Date(item.date), "d MMM", {
          locale: sv,
        });

        const score = document.createElement("strong");
        score.textContent = `${item.score} av ${item.total}`;

        const time = document.createElement("span");
        time.textContent = item.time;

        li.append(date, score, time);
        historyList.appendChild(li);
      });

      // Visar ett meddelande om historiken är tom
      if (history.length === 0) {
        historyList.textContent = "Inga sparade resultat ännu.";
      }

      // Hämtar sektionen där frågorna ska visas
      const questionResults = document.querySelector(".question-results");

      // Informerar spelaren om obesvarade frågor
      if (result && result.answers.length < result.total) {
        const unanswered = result.total - result.answers.length;

        document.querySelector("#finished-title").textContent = "Tiden är ute!";

        document.querySelector(".finished-description").textContent =
          `Du svarade på ${result.answers.length} av ${result.total} frågor.`;

        const message = document.createElement("p");
        message.textContent = `${unanswered} frågor lämnades obesvarade.`;

        questionResults.appendChild(message);
      }

      // Genererar ett resultatkort för varje besvarad fråga
      if (result?.answers) {
        result.answers.forEach((answer, index) => {
          const details = document.createElement("details");

          details.className = answer.isCorrect
            ? "result-item is-correct"
            : "result-item is-incorrect";

          details.innerHTML = `
      <summary>
        <span class="status-icon" aria-hidden="true">
          ${answer.isCorrect ? "✓" : "✕"}
        </span>

        <span class="question-copy">
          <span class="question-meta">
            Fråga ${index + 1} · ${answer.isCorrect ? "Rätt" : "Fel"}
          </span>
          <span class="question-text" lang="en"></span>
        </span>

        <svg class="question-chevron"
          viewBox="0 0 24 24" aria-hidden="true">
          <path d="m5 9 7 7 7-7" />
        </svg>
      </summary>

      <div class="answer-panel">
        <div class="answer-grid">
          <div class="answer-box">
            <p class="answer-label">Ditt svar</p>
            <p class="selected-answer" lang="en"></p>
          </div>

          <div class="answer-box">
            <p class="answer-label">Rätt svar</p>
            <p class="correct-answer" lang="en"></p>
          </div>
        </div>
      </div>
    `;

          // Fyller kortet med spelarens riktiga data
          details.querySelector(".question-text").textContent = answer.question;

          details.querySelector(".selected-answer").textContent =
            answer.options[answer.selected];

          details.querySelector(".correct-answer").textContent =
            answer.options[answer.correct];

          // Lägger till kortet på resultatsidan
          questionResults.appendChild(details);
        });
      }
      // Två vyer i samma result.html. Vi använder #results för att växla.
      const finishedPage = document.querySelector(".finished-page");
      const resultsPage = document.querySelector(".results-page");

      function updateResultView() {
        const showResults = window.location.hash === "#results";
        finishedPage.hidden = showResults;
        resultsPage.hidden = !showResults;
        document.title = showResults
          ? "Ditt resultat | Quiz Tajm"
          : "Quiz avslutat | Quiz Tajm";
        window.scrollTo(0, 0);
      }

      window.addEventListener("hashchange", updateResultView);
      updateResultView();
    </script>
  </body>
</html>
